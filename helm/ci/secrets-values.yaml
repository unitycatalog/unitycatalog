# Renders the secrets the chart passes to the server as environment variables, so that chart lint covers them.
storage:
  credentials:
    s3:
      - bucketPath: s3://ci-bucket
        region: us-west-2
        credentialsSecretName: ci-s3-credentials
    adls:
      - storageAccountName: ciaccount
        credentialsSecretName: ci-adls-credentials
server:
  db:
    type: postgresql
    postgresqlConfig:
      host: ci-postgres
      dbName: ucdb
      username: uc
      passwordSecretName: ci-db-password
      passwordSecretKey: password
  config:
    # A custom template still gets the deprecated init container variables.
    extraProperties:
      ci.legacy.secretKey: ${S3_SECRET_KEY_0}

{{- if .Values.server.enabled -}}
{{- if and (eq .Values.server.db.type "file") (gt (int .Values.server.deployment.replicaCount) 1) }}
{{- fail "server.db.type file supports one server: set server.deployment.replicaCount to 1, or use postgresql or mysql" }}
{{- end }}
{{- if and .Values.server.migration.backup.enabled (gt (int .Values.server.deployment.replicaCount) 1) }}
{{- fail "server.migration.backup.enabled needs server.deployment.replicaCount: 1: during the upgrade every other new server holds connections to the database, which the copy and the restore need to be free. Scale to 1 for the upgrade, then scale back." }}
{{- end }}
{{- if and .Values.server.migration.backup.enabled (contains "jdbc:h2:mem:" (.Values.server.db.overrideConfig | default "")) }}
{{- fail "server.migration.backup.enabled needs an H2 file database, but server.db.overrideConfig uses one in memory (jdbc:h2:mem:). Turn the backup off, or use a file database." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unitycatalog.server.fullname" . | quote }}
  labels: {{- include "unitycatalog.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.deployment.replicaCount }}
  selector:
    matchLabels: {{- include "unitycatalog.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/serverConfig: {{ include "unitycatalog.server.configTemplate" . | sha256sum | quote }}
        checksum/hibernateConfig: {{ include "unitycatalog.server.hibernateConfigTemplate" . | sha256sum | quote }}
        checksum/log4j2Config: {{ include "unitycatalog.server.log4j2ConfigTemplate" . | sha256sum | quote }}
      {{- with .Values.server.deployment.extraPodAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "unitycatalog.server.labels" . | nindent 8 }}
        {{- with .Values.server.deployment.extraPodLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.server.deployment.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "unitycatalog.serviceAccountName" . | quote }}
      terminationGracePeriodSeconds: {{ .Values.server.deployment.terminationGracePeriodSeconds }}
      {{- with .Values.server.deployment.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "unitycatalog.server.initContainer" . | nindent 8 }}
      {{- with .Values.server.deployment.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          {{- with .Values.server.deployment.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.server.deployment.image.repository }}:{{ .Values.server.deployment.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.server.deployment.image.pullPolicy | quote }}
          ports:
            - name: api
              containerPort: {{ .Values.server.deployment.port }}
              protocol: TCP
          {{- if or .Values.server.migration.backup.enabled (eq .Values.server.db.type "mysql") }}
          env:
          {{- if .Values.server.migration.backup.enabled }}
            # A restore marks the database with this revision: later starts of the same revision refuse instead of
            # upgrading again, and a new revision clears the mark. Only with the backup on, because a value that
            # changes with every revision restarts the servers on every helm upgrade.
            - name: UC_CHART_REVISION
              value: {{ .Values.server.migration.backup.chartRevision | default .Release.Revision | quote }}
          {{- end }}
          {{- if eq .Values.server.db.type "mysql" }}
            # The image does not include the MySQL JDBC driver. Its launcher lists the classpath jars in a file, so the
            # driver jars mounted from the volume load from the module path instead.
            - name: JDK_JAVA_OPTIONS
              value: "--module-path=/home/unitycatalog/jdbc-drivers --add-modules=ALL-MODULE-PATH"
          {{- end }}
          {{- end }}

          {{- if .Values.server.deployment.enableLivenessProbe }}
          {{- with .Values.server.deployment.livenessProbe }}
          livenessProbe: {{- toYaml . | nindent 12 }}
          {{- else }}
          livenessProbe:
            tcpSocket:
              port: api
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 30 # 5 minutes
          {{- end }}
          {{- end }}

          {{- if .Values.server.deployment.enableReadinessProbe }}
          {{- with .Values.server.deployment.readinessProbe }}
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: api
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 30 # 5 minutes
          {{- end }}
          {{- end }}

          {{- if .Values.server.deployment.enableStartupProbe }}
          {{- with .Values.server.deployment.startupProbe }}
          startupProbe: {{- toYaml . | nindent 12 }}
          {{- else }}
          startupProbe:
            tcpSocket:
              port: api
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 180 # 30 minutes, for a schema upgrade at start
          {{- end }}
          {{- end }}

          volumeMounts:
            - name: config-volume
              mountPath: /home/unitycatalog/etc/conf
          {{- if eq .Values.server.db.type "file" }}
            - name: db-volume
              mountPath: /home/unitycatalog/etc/db
          {{- end }}
          {{- if eq .Values.server.db.type "mysql" }}
            - name: mysql-driver
              mountPath: /home/unitycatalog/jdbc-drivers
              readOnly: true
          {{- end }}
          {{- range $index, $config := .Values.storage.credentials.gcs }}
            - name: gcs-credentials-{{ $index }}
              mountPath: /home/unitycatalog/etc/conf/gcs-credentials-{{ $index }}.json
              subPath: jsonKey
              readOnly: true
          {{- end }}
          {{- with .Values.server.deployment.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.server.deployment.extraContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - configMap:
            name: "{{ include "unitycatalog.fullname" . }}-server-config-templates"
          name: config-templates
        - name: config-volume
          emptyDir: {}
        - name: jwt-key-volume
          secret:
            secretName: {{ include "unitycatalog.server.jwtKeypairSecretName" . | quote }}
      {{- if and (eq .Values.server.db.type "file") (not .Values.server.db.fileConfig.persistence.enabled) }}
        - name: db-volume
          emptyDir: {}
      {{- else if and (eq .Values.server.db.type "file") .Values.server.db.fileConfig.persistence.enabled }}
        - name: db-volume
          persistentVolumeClaim:
            claimName: {{ include "unitycatalog.server.db.filePvcName" . | quote }}
      {{- end }}
      {{- if eq .Values.server.db.type "mysql" }}
        - name: mysql-driver
          {{- toYaml (required "server.db.mysqlConfig.driver.volume is required: the server image does not include the MySQL JDBC driver" .Values.server.db.mysqlConfig.driver.volume) | nindent 10 }}
      {{- end }}
      {{- range $index, $config := .Values.storage.credentials.gcs }}
        - name: gcs-credentials-{{ $index }}
          secret:
            secretName: {{ $config.credentialsSecretName | quote }}
      {{- end }}
      {{- with .Values.server.deployment.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.deployment.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.deployment.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.deployment.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  strategy:
  {{- if .Values.server.deployment.updateStrategy }}
    {{- toYaml .Values.server.deployment.updateStrategy | nindent 4 }}
  {{- else }}
    # Old and new servers must not run at once while the new one upgrades the schema.
    type: Recreate
  {{- end }}
{{- end -}}

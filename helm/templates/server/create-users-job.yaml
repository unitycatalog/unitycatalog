{{- if and .Values.auth.enabled .Values.auth.users -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "unitycatalog.server.fullname" . }}-create-users"
  labels: {{- include "unitycatalog.server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.server.createUsersJob.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ttlSecondsAfterFinished: {{ .Values.server.createUsersJob.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.server.createUsersJob.backoffLimit }}
  template:
    spec:
      serviceAccountName: {{ include "unitycatalog.serviceAccountName" . | quote }}
      containers:
        - name: create-users
          image: "{{ .Values.server.createUsersJob.image.repository }}:{{ .Values.server.createUsersJob.image.tag }}"
          imagePullPolicy: {{ .Values.server.createUsersJob.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -c
            - |-
              set -eo pipefail

              apk add --no-cache curl
              apk add --no-cache jq
              apk add --no-cache uuidgen
              apk add --no-cache openssl
              apk add --no-cache jwt-cli --repository=https://dl-cdn.alpinelinux.org/alpine/edge/testing/

              if [ -f /key/private_key.pem ]; then
                KEY="/key/private_key.pem"
              elif [ -f /key/private_key.der ]; then
                KEY="/key/private_key.der"
              else
                echo "Private key not found in /key directory. Exiting."
                exit 1
              fi

              TOKEN=$(jwt encode --jti $(uuidgen | tr '[:upper:]' '[:lower:]') --iss internal --sub admin --alg RS512 --secret "@${KEY}")

              until curl --fail-with-body -H "Authorization: Bearer ${TOKEN}" \
              -X GET "http://{{ include "unitycatalog.server.fullname" . }}:{{ .Values.server.service.port }}/api/1.0/unity-control/scim2/Users" \
              -H "Content-Type: application/json"
              do
                  echo "Waiting for Unity Catalog server API to be available..."
                  sleep 1
              done

              METASTORE_ID=$(curl --fail-with-body -H "Authorization: Bearer ${TOKEN}" \
              -X GET "http://{{ include "unitycatalog.server.fullname" . }}:{{ .Values.server.service.port }}/api/2.1/unity-catalog/metastore_summary" \
              -H "Content-Type: application/json" | jq -e '.metastore_id')

              USERS_URL="http://{{ include "unitycatalog.server.fullname" $ }}:{{ $.Values.server.service.port }}/api/1.0/unity-control/scim2/Users"

              {{- range $index, $user := .Values.auth.users }}
              EMAIL='{{ $user.email | default "" | toString | replace "'" "'\\''" }}'
              NAME='{{ $user.name | default "" | toString | replace "'" "'\\''" }}'
              # The list returns one page of users, so look the user up by email. The filter ignores case,
              # but users whose emails differ in case are different users.
              FILTER=$(jq -rn --arg email "${EMAIL}" '"emails.value eq \($email | tojson)"')
              USER_EXISTS=$(curl --fail-with-body -sS -G -H "Authorization: Bearer ${TOKEN}" \
                  --data-urlencode "filter=${FILTER}" "${USERS_URL}" \
                  | jq --arg email "${EMAIL}" 'any(.Resources[]?; .emails[0].value == $email)')
              if [ "${USER_EXISTS}" = true ]
              then
                  echo "User ${EMAIL} already exists"
              else
                  echo "User ${EMAIL} is being created"
                  STATUS=$(curl -sS -o /dev/stderr -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" \
                  -X POST "${USERS_URL}" \
                  -H "Content-Type: application/json" \
                  -d "$(jq -n --arg name "${NAME}" --arg email "${EMAIL}" '{displayName: $name, emails: [{primary: true, value: $email}]}')")
                  case "${STATUS}" in
                    201) echo "User ${EMAIL} created" ;;
                    # Another client created the user after the lookup.
                    409) echo "User ${EMAIL} already exists" ;;
                    *) echo "Creating user ${EMAIL} failed with HTTP ${STATUS}"; exit 1 ;;
                  esac
              fi
              {{- if $user.canCreateCatalogs }}
              echo "Granting CREATE CATALOG permission to ${EMAIL}"

              curl --fail-with-body -H "Authorization: Bearer ${TOKEN}" \
              -X PATCH "http://{{ include "unitycatalog.server.fullname" $ }}:{{ $.Values.server.service.port }}/api/2.1/unity-catalog/permissions/metastore/${METASTORE_ID}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg email "${EMAIL}" '{changes: [{principal: $email, add: ["CREATE CATALOG"]}]}')"
              {{- end }}
              {{- end }}
          volumeMounts:
            - name: jwt-key-volume
              mountPath: /key
      volumes:
        - name: jwt-key-volume
          secret:
            secretName: {{ include "unitycatalog.server.jwtKeypairSecretName" . | quote }}
      restartPolicy: OnFailure
{{- end -}}

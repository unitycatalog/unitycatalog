server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;

    # Look the bridge up through Docker's DNS, at most 10 seconds apart, not
    # once at startup, so a recreated bridge container is found at its new
    # address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $bridge http://bridge:8081;

    location ~ ^/uc\.v1\. {
        proxy_pass $bridge;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 35s;
    }

    location = /config {
        proxy_pass $bridge;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass $bridge;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

name: Helm Chart Tests

# Pull requests only: their caches are scoped to the pull request, so this job can't write caches that main reads.
on:
  pull_request:
    paths:
      - "helm/**"
      - "ui/**"
      - "Dockerfile"
      - ".github/workflows/helm-chart-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-chart:
    name: Lint and install the Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          uv_version: 0.13.1

      - name: Check that the chart README is up to date
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/helm:/helm-docs" \
            jnorwood/helm-docs:v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c
          # helm-docs may only regenerate helm/README.md; any other change under helm/ also fails.
          if [ -n "$(git status --porcelain -- helm)" ]; then
            git status --short -- helm
            echo "::error::helm-docs changed files under helm/. If only helm/README.md changed, regenerate it with helm-docs v1.14.2 (pre-commit run helm-docs --all-files) and commit the result."
            exit 1
          fi

      - name: Lint the chart
        run: ct lint --charts helm --validate-maintainers=false --check-version-increment=false

      - name: Check how non-default values render
        run: |
          set -euo pipefail
          # Without obsPort the server gets --port but no --obs-port, and the probes check the API port.
          out="$(helm template uc helm --set server.deployment.port=9000 \
            --set server.deployment.enableReadinessProbe=true)"
          grep -A1 -- '- --port' <<<"$out" | grep -qF -- '- "9000"'
          ! grep -qF -- '--obs-port' <<<"$out" || exit 1
          grep -A1 'readinessProbe:' <<<"$out" | grep -qF 'tcpSocket:'
          grep -A1 'command:' <<<"$out" | grep -qF -- '- ./bin/start-uc-server'
          # A custom command replaces the default one.
          out="$(helm template uc helm --set 'server.deployment.command={/entrypoint.sh,./bin/start-uc-server}')"
          grep -A2 'command:' <<<"$out" | grep -qF -- '- /entrypoint.sh'
          ! grep -A1 'command:' <<<"$out" | grep -qF -- '- ./bin/start-uc-server' || exit 1
          # An upgrade with --reuse-values from an older release has no command value; keep the default.
          out="$(helm template uc helm --set server.deployment.command=null)"
          grep -A1 'command:' <<<"$out" | grep -qF -- '- ./bin/start-uc-server'
          # The create-users job calls the server through its Service, so it uses the Service port.
          out="$(helm template uc helm --set server.deployment.port=9000 --set server.service.port=8181 \
            --set auth.enabled=true --set 'auth.users[0].name=admin' --set 'auth.users[0].email=admin@example.com')"
          grep -qF 'uc-unitycatalog-server:8181/api/' <<<"$out"
          ! grep -qF 'uc-unitycatalog-server:9000' <<<"$out" || exit 1
          # With obsPort, the flag, the container port and the probes all use it.
          out="$(helm template uc helm --set server.deployment.obsPort=9099 \
            --set server.deployment.enableReadinessProbe=true \
            --set server.deployment.enableLivenessProbe=true)"
          grep -A1 -- '- --obs-port' <<<"$out" | grep -qF -- '- "9099"'
          grep -qF 'containerPort: 9099' <<<"$out"
          ready="$(grep -A3 'readinessProbe:' <<<"$out")"
          grep -qF 'path: /readyz' <<<"$ready"
          grep -qF 'port: obs' <<<"$ready"
          live="$(grep -A3 'livenessProbe:' <<<"$out")"
          grep -qF 'path: /livez' <<<"$live"
          grep -qF 'port: obs' <<<"$live"
          # obsPort must differ from port.
          if err="$(helm template uc helm --set server.deployment.obsPort=8080 2>&1)"; then exit 1; fi
          grep -qF 'obsPort must differ' <<<"$err"
          # Custom probes render as given, not as the whole chart context.
          args=(--set ui.enabled=true)
          for c in server ui; do
            for probe in readiness liveness startup; do
              args+=(--set "$c.deployment.enable${probe^}Probe=true"
                --set "$c.deployment.${probe}Probe.httpGet.path=/custom-$c-$probe"
                --set "$c.deployment.${probe}Probe.httpGet.port=8080")
            done
          done
          out="$(helm template uc helm "${args[@]}")"
          for c in server ui; do
            for probe in readiness liveness startup; do
              grep -qF "path: /custom-$c-$probe" <<<"$out"
            done
          done
          ! grep -qE '^ +(Capabilities|Release|Values):' <<<"$out" || exit 1
          # An explicit grace period of 0 is kept.
          out="$(helm template uc helm --set server.deployment.terminationGracePeriodSeconds=0)"
          grep -qE '^ +terminationGracePeriodSeconds: 0$' <<<"$out"
          # Storage secrets reach the server as UC_ variables, not through server.properties.
          secrets=(-f helm/ci/secrets-values.yaml --set auth.enabled=true --set auth.clientSecretName=ci-oauth)
          out="$(helm template uc helm "${secrets[@]}" --set server.config.extraProperties=null)"
          # Every part of a credential, so a restart after a rotation reads one set.
          for ref in UC_S3_ACCESSKEY_0:ci-s3-credentials:accessKey UC_S3_SECRETKEY_0:ci-s3-credentials:secretKey \
            UC_ADLS_TENANTID_0:ci-adls-credentials:tenantId UC_ADLS_CLIENTID_0:ci-adls-credentials:clientId \
            UC_ADLS_CLIENTSECRET_0:ci-adls-credentials:clientSecret; do
            IFS=: read -r name secret key <<<"$ref"
            grep -A4 -- "- name: $name\$" <<<"$out" | tr -d '\n' | grep -qE "name: \"$secret\" +key: $key( |\$)"
          done
          ! grep -qE 'server\.client-secret|s3\.secretKey|adls\.clientSecret' <<<"$out" || exit 1
          # The deprecated init container variables are there only for a custom template.
          ! grep -qE -- '- name: (S3_SECRET_KEY_0|ADLS_CLIENT_SECRET_0|OAUTH_CLIENT_SECRET)$' <<<"$out" || exit 1
          out="$(helm template uc helm "${secrets[@]}")"
          for name in S3_SECRET_KEY_0 ADLS_CLIENT_SECRET_0 OAUTH_CLIENT_SECRET; do
            grep -qE -- "- name: $name\$" <<<"$out"
          done
          grep -A6 -- '- name: OAUTH_CLIENT_SECRET$' <<<"$out" | grep -qF 'optional: true'
          out="$(helm template uc helm -f helm/ci/secrets-values.yaml)"
          ! grep -qE -- '- name: OAUTH_CLIENT_SECRET$' <<<"$out" || exit 1

      - name: Build the server and UI images
        run: |
          docker build -t unitycatalog:ci .
          docker build -t unitycatalog-ui:ci ui

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.1

      - name: Load the images into kind
        # package-chart.sh 0.0.0-ci stamps app version v0.0.0-ci, which sets both image tags.
        run: |
          docker tag unitycatalog:ci unitycatalog:v0.0.0-ci
          docker tag unitycatalog-ui:ci unitycatalog-ui:v0.0.0-ci
          kind load docker-image unitycatalog:v0.0.0-ci unitycatalog-ui:v0.0.0-ci --name chart-testing

      - name: Package the chart as a release, install it and run helm test
        run: |
          helm/package-chart.sh 0.0.0-ci "$RUNNER_TEMP"
          # Upgrades rely on unchanged resource names: the PVC and signing key Secret are pre-install
          # hooks, so nothing recreates them under a new name.
          helm template unitycatalog "$RUNNER_TEMP/unitycatalog-chart-0.0.0-ci.tgz" > "$RUNNER_TEMP/names.yaml"
          for name in unitycatalog-server unitycatalog-server-db unitycatalog-server-jwt-key unitycatalog-ui; do
            grep -qE "^  name: \"?$name\"?\$" "$RUNNER_TEMP/names.yaml" || { echo "::error::No resource named $name"; exit 1; }
          done
          helm install uc "$RUNNER_TEMP/unitycatalog-chart-0.0.0-ci.tgz" --namespace uc --create-namespace --wait --timeout 600s \
            --set server.deployment.image.repository=unitycatalog \
            --set server.deployment.image.pullPolicy=Never \
            --set server.deployment.obsPort=8090 \
            --set server.deployment.enableReadinessProbe=true \
            --set ui.deployment.image.repository=unitycatalog-ui \
            --set ui.deployment.image.pullPolicy=Never
          helm test uc --namespace uc --logs

name: Helm Chart Tests

# Pull requests only: their caches are scoped to the pull request, so this job can't write caches that main reads.
on:
  pull_request:
    paths:
      - "helm/**"
      - "ui/**"
      - "Dockerfile"
      # The chart runs the server's schema upgrade command before the server starts.
      - "server/src/main/java/io/unitycatalog/server/migrate/**"
      - "server/src/main/resources/db/**"
      - "server/src/main/resources/schema-effects/**"
      - "server/src/main/java/io/unitycatalog/server/UnityCatalogServer.java"
      - "server/src/main/java/io/unitycatalog/server/utils/OptionParser.java"
      - "bin/start-uc-server"
      - ".github/workflows/helm-chart-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-chart:
    name: Lint and install the Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # HEAD^1, the first parent of the merge commit, is the code this change starts from. The
          # upgrade test installs its chart and server first.
          fetch-depth: 2

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          uv_version: 0.13.1

      - name: Check that the chart README is up to date
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/helm:/helm-docs" \
            jnorwood/helm-docs:v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c
          # helm-docs may only regenerate helm/README.md; any other change under helm/ also fails.
          if [ -n "$(git status --porcelain -- helm)" ]; then
            git status --short -- helm
            echo "::error::helm-docs changed files under helm/. If only helm/README.md changed, regenerate it with helm-docs v1.14.2 (pre-commit run helm-docs --all-files) and commit the result."
            exit 1
          fi

      - name: Lint the chart
        run: ct lint --charts helm --validate-maintainers=false --check-version-increment=false

      - name: Build the server and UI images
        run: |
          docker build -t unitycatalog:ci .
          docker build -t unitycatalog-ui:ci ui
          mkdir "$RUNNER_TEMP/base"
          git archive HEAD^1 | tar -x -C "$RUNNER_TEMP/base"
          docker build -t unitycatalog:base "$RUNNER_TEMP/base"

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.1

      - name: Load the images into kind
        # package-chart.sh 0.0.0-ci stamps app version v0.0.0-ci, which sets both image tags.
        run: |
          docker tag unitycatalog:ci unitycatalog:v0.0.0-ci
          docker tag unitycatalog-ui:ci unitycatalog-ui:v0.0.0-ci
          kind load docker-image unitycatalog:v0.0.0-ci unitycatalog-ui:v0.0.0-ci unitycatalog:base --name chart-testing

      - name: Package the chart as a release, install it and run helm test
        run: |
          helm/package-chart.sh 0.0.0-ci "$RUNNER_TEMP"
          # Upgrades rely on unchanged resource names: the PVC and signing key Secret are pre-install
          # hooks, so nothing recreates them under a new name.
          helm template unitycatalog "$RUNNER_TEMP/unitycatalog-chart-0.0.0-ci.tgz" > "$RUNNER_TEMP/names.yaml"
          for name in unitycatalog-server unitycatalog-server-db unitycatalog-server-jwt-key unitycatalog-ui; do
            grep -qE "^  name: \"?$name\"?\$" "$RUNNER_TEMP/names.yaml" || { echo "::error::No resource named $name"; exit 1; }
          done
          helm install uc "$RUNNER_TEMP/unitycatalog-chart-0.0.0-ci.tgz" --namespace uc --create-namespace --wait --timeout 600s \
            --set server.deployment.image.repository=unitycatalog \
            --set server.deployment.image.pullPolicy=Never \
            --set ui.deployment.image.repository=unitycatalog-ui \
            --set ui.deployment.image.pullPolicy=Never
          helm test uc --namespace uc --logs
          helm uninstall uc --namespace uc --wait

      - name: Upgrade from the base chart and check that the data is kept
        run: |
          # Installs the chart and server this change starts from, creates a catalog, upgrades to this
          # change's chart and server, then reads the catalog back.
          common=(--wait --timeout 600s --set fullnameOverride=upg --set ui.enabled=false
            --set server.deployment.image.repository=unitycatalog --set server.deployment.image.pullPolicy=Never)
          catalogs=http://localhost:8080/api/2.1/unity-catalog/catalogs
          upgrade_test() {
            local ns=$1
            shift
            helm install upg "$RUNNER_TEMP/base/helm" --namespace "$ns" --create-namespace "${common[@]}" \
              --set server.deployment.image.tag=base "$@"
            kubectl exec --namespace "$ns" deploy/upg-server -c server -- wget -q -O - \
              --header "Content-Type: application/json" --post-data '{"name":"kept_by_upgrade"}' "$catalogs"
            helm upgrade upg "$RUNNER_TEMP/unitycatalog-chart-0.0.0-ci.tgz" --namespace "$ns" "${common[@]}" "$@"
            kubectl rollout status --namespace "$ns" deploy/upg-server --timeout 300s
            kubectl logs --namespace "$ns" deploy/upg-server -c upgrade-schema
            kubectl exec --namespace "$ns" deploy/upg-server -c server -- wget -q -O - "$catalogs/kept_by_upgrade" \
              | grep -q '"name":"kept_by_upgrade"' || { echo "::error::The catalog is gone after the upgrade ($ns)"; exit 1; }
            helm test upg --namespace "$ns" --logs
            helm uninstall upg --namespace "$ns" --wait
          }

          upgrade_test upgrade-h2

          # PostgreSQL with two replicas, whose init containers both run the schema upgrade. The image is
          # the one the PostgreSQL tests use.
          kubectl create namespace upgrade-pg
          kubectl run postgres --namespace upgrade-pg --port 5432 --expose \
            --image postgres@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5 \
            --env POSTGRES_USER=uc --env POSTGRES_PASSWORD=uc --env POSTGRES_DB=ucdb
          kubectl wait --namespace upgrade-pg --for=condition=Ready pod/postgres --timeout 300s
          # Over TCP, so that the server the image runs while it initializes the database does not count.
          for i in $(seq 1 60); do
            kubectl exec --namespace upgrade-pg postgres -- pg_isready -h 127.0.0.1 -U uc -d ucdb && break
            sleep 2
          done
          kubectl create secret generic db-password --namespace upgrade-pg --from-literal=password=uc
          upgrade_test upgrade-pg --set server.deployment.replicaCount=2 --set server.db.type=postgresql \
            --set server.db.postgresqlConfig.host=postgres --set server.db.postgresqlConfig.username=uc \
            --set server.db.postgresqlConfig.passwordSecretName=db-password

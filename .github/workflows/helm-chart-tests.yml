name: Helm Chart Tests

# Pull requests only: their caches are scoped to the pull request, so this job can't write caches that main reads.
on:
  pull_request:
    paths:
      - "helm/**"
      - "ui/**"
      - "Dockerfile"
      - ".github/workflows/helm-chart-tests.yml"
      # Schema steps: the job also upgrades a release from the base branch.
      - "server/src/main/resources/db/**"
      - "server/src/main/java/io/unitycatalog/server/migrate/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-chart:
    name: Lint and install the Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          uv_version: 0.13.1

      - name: Check that the chart README is up to date
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/helm:/helm-docs" \
            jnorwood/helm-docs:v1.14.2@sha256:7e562b49ab6b1dbc50c3da8f2dd6ffa8a5c6bba327b1c6335cc15ce29267979c
          # helm-docs may only regenerate helm/README.md; any other change under helm/ also fails.
          if [ -n "$(git status --porcelain -- helm)" ]; then
            git status --short -- helm
            echo "::error::helm-docs changed files under helm/. If only helm/README.md changed, regenerate it with helm-docs v1.14.2 (pre-commit run helm-docs --all-files) and commit the result."
            exit 1
          fi

      - name: Lint the chart
        run: ct lint --charts helm --validate-maintainers=false --check-version-increment=false

      - name: Build the server and UI images
        run: |
          docker build -t unitycatalog:ci .
          docker build -t unitycatalog-ui:ci ui

      - name: Build the server image of the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          docker build -t unitycatalog:base "$RUNNER_TEMP/base"

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.1

      - name: Load the images into kind
        # package-chart.sh 0.0.0-ci stamps app version v0.0.0-ci, which sets both image tags.
        run: |
          docker tag unitycatalog:ci unitycatalog:v0.0.0-ci
          docker tag unitycatalog-ui:ci unitycatalog-ui:v0.0.0-ci
          kind load docker-image unitycatalog:v0.0.0-ci unitycatalog-ui:v0.0.0-ci unitycatalog:base --name chart-testing

      - name: Package the chart as a release, install it and run helm test
        run: |
          helm/package-chart.sh 0.0.0-ci "$RUNNER_TEMP"
          helm install uc "$RUNNER_TEMP/unitycatalog-chart-0.0.0-ci.tgz" --namespace uc --create-namespace --wait --timeout 600s \
            --set server.deployment.image.repository=unitycatalog \
            --set server.deployment.image.pullPolicy=Never \
            --set ui.enabled=true \
            --set ui.deployment.image.repository=unitycatalog-ui \
            --set ui.deployment.image.pullPolicy=Never
          helm test uc --namespace uc --logs

      - name: Upgrade a PostgreSQL release from the base branch and run helm test
        # Installs the base branch's chart and server image, creates a catalog, then upgrades to this chart and image:
        # the pre-upgrade check Job must pass, the new server upgrades the schema, and the catalog must still be there.
        run: |
          kubectl create namespace uc-upgrade
          kubectl create secret generic db-password --namespace uc-upgrade --from-literal=password=uc-ci-password
          kubectl apply --namespace uc-upgrade -f - <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres
          spec:
            selector:
              matchLabels: {app: postgres}
            template:
              metadata:
                labels: {app: postgres}
              spec:
                containers:
                  - name: postgres
                    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
                    env:
                      - {name: POSTGRES_DB, value: ucdb}
                      - name: POSTGRES_PASSWORD
                        valueFrom:
                          secretKeyRef: {name: db-password, key: password}
                    ports:
                      - containerPort: 5432
                    readinessProbe:
                      exec:
                        command: ["pg_isready", "-U", "postgres", "-d", "ucdb"]
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres
          spec:
            selector: {app: postgres}
            ports:
              - port: 5432
          EOF
          kubectl rollout status deployment/postgres --namespace uc-upgrade --timeout 300s

          # fullnameOverride keeps the resource names when the base branch's chart has another name.
          values=(
            --set fullnameOverride=uc
            --set ui.enabled=false
            --set server.db.type=postgresql
            --set server.db.postgresqlConfig.host=postgres
            --set server.db.postgresqlConfig.passwordSecretName=db-password
            --set server.deployment.image.repository=unitycatalog
            --set server.deployment.image.pullPolicy=Never
          )
          api() {
            kubectl exec --namespace uc-upgrade deploy/uc-server -c server -- \
              wget -q -O - --header "Content-Type: application/json" "$@"
          }

          helm install uc "$RUNNER_TEMP/base/helm" --namespace uc-upgrade --wait --timeout 600s "${values[@]}" \
            --set server.deployment.image.tag=base
          api --post-data '{"name": "created_before_upgrade"}' http://localhost:8080/api/2.1/unity-catalog/catalogs

          helm upgrade uc "$RUNNER_TEMP/unitycatalog-chart-0.0.0-ci.tgz" --namespace uc-upgrade --wait --timeout 600s \
            "${values[@]}"
          kubectl get events --namespace uc-upgrade --field-selector involvedObject.name=uc-server-upgrade-check,reason=Completed \
            -o name | grep -q . || { echo "::error::The pre-upgrade check Job did not run"; exit 1; }
          kubectl logs --namespace uc-upgrade deploy/uc-server -c server | grep -i "schema" || true
          helm test uc --namespace uc-upgrade --logs
          api http://localhost:8080/api/2.1/unity-catalog/catalogs/created_before_upgrade

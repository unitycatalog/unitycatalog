
services:
  db:
    image: mysql:8.4.1
    restart: always
    # Case-sensitive text comparison, like PostgreSQL and H2.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_bin
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ucdb
      MYSQL_USER: uc_default_user
      MYSQL_PASSWORD: uc_default_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '3306:3306'

volumes:
  mysql_data:
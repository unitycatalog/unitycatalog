hibernate.connection.driver_class=org.h2.Driver
# DB_CLOSE_ON_EXIT=FALSE keeps the database open while requests drain on shutdown. It closes when
# the server closes its connection pool afterwards, so don't add DB_CLOSE_DELAY=-1.
hibernate.connection.url=jdbc:h2:file:./etc/db/h2db;DB_CLOSE_ON_EXIT=FALSE

# One HikariCP pool for Hibernate and Casbin (a single maximumPoolSize cap).
# Autocommit defaults to false. jdbc-adapter 2.7.0 still holds one pooled connection;
# Casbin enables autocommit on that checkout only.
hibernate.hikari.maximumPoolSize=20
hibernate.hikari.minimumIdle=2

hibernate.hbm2ddl.auto=update
hibernate.show_sql=false
hibernate.archive.autodetection=class
hibernate.use_sql_comments=true
org.hibernate.SQL=INFO
org.hibernate.type.descriptor.sql.BasicBinder=TRACE
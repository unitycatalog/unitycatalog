server.env=dev
## Identity Provider authorization parameters
# examples:
# authorization=enable
# authorization-url=https://accounts.google.com/o/oauth2/auth
# token-url=https://oauth2.googleapis.com/token
# client-id=111122223333-abab1212cdcd3434.apps.googleusercontent.com
# client-secret: set it in the UC_SERVER_CLIENT_SECRET environment variable
# server.allowed-issuers=https://accounts.google.com
# server.allowed-jwks-uris=https://www.googleapis.com/oauth2/v3/certs
# server.audiences=111122223333-abab1212cdcd3434.apps.googleusercontent.com
server.authorization=disable
server.authorization-url=
server.token-url=
server.client-id=
# Only bin/uc auth login reads it. Deprecated here: set it in the UC_SERVER_CLIENT_SECRET environment
# variable of the shell that runs that command instead (see Secrets in docs/server/configuration.md).
server.client-secret=
server.redirect-port=

# Privilege decisions use Casbin by default. OPA requires server.authorization=enable.
# Native grant/revoke/list APIs remain available, but their grants do not affect OPA decisions.
# server.authorization.provider=casbin
# server.authorization.opa.decision-url=http://localhost:8181/v1/data/uc/authz
# Response timeout for each OPA call, not for the complete UC request.
# ISO-8601 duration, at least PT0.001S (1 ms).
# server.authorization.opa.response-timeout=PT5S

# Permission-check migration. Stricter checks are on by default.
# Set false temporarily to keep the previous rules, including access those rules allowed.
# Use the same setting on every server instance and restart after changing it.
# server.authorization.strict-privilege-checks=true

# Required when authorization is enabled: Comma-separated list of allowed token issuers
# (exact match or wildcard with *; each * matches a single DNS label). Cannot be "*" alone.
# Wildcard issuers are evaluated before signature verification; see docs/server/auth.md.
# Tokens from issuers not in this list will be rejected
# Example for Google: https://accounts.google.com
# Example for Microsoft Entra ID: https://login.microsoftonline.com/{tenant-id}/v2.0
server.allowed-issuers=

# Optional: exact JWKS URLs allowed on a different origin (scheme, host, or port).
# Set this for providers such as Google that publish keys on a separate host.
# HTTPS issuers require HTTPS key URLs. Redirects are rejected.
server.allowed-jwks-uris=

# Required when authorization is enabled: Comma-separated list of expected JWT audiences
# (exact match or wildcard with *; each * matches a single DNS label). Use "*" alone to
# disable audience validation.
# Tokens not intended for these audiences will be rejected
# Typically your application's client ID or API identifier
server.audiences=

# D-Days H-Hours M-Minutes S-Seconds (P5D = 5 days,PT5H = 5 hours, PT5M = 5 minutes, PT5S = 5 seconds)
server.cookie-timeout=P5D
server.access-token-timeout=PT24H

# How long a graceful stop waits for in-flight HTTP requests; close then gives the blocking-work
# drain whatever is left of it. This is not a total shutdown deadline: stopping storage cleanup,
# Armeria's final event-loop shutdown (about 2s), and closing the authorizer and database pool
# add time, about 12s in all with the default. Give docker stop 15s or more, and keep the
# Kubernetes grace period (default 30s) above that; see docs/server/configuration.md.
# server.shutdown-timeout=PT5S

# Authorization policy refresh across server instances that share one database.
# Applies to Casbin decisions only; OPA decisions are unaffected.
# Required for any multi-instance / HA deployment that uses Casbin: each instance
# keeps policy in memory, and without refresh, grants/revokes made through another
# instance are invisible until restart. See docs/server/auth.md.
#
# server.authorization.policy-refresh=false
#   Kill switch. "false" (default) is for single-instance deployments. Set to
#   "true" whenever more than one UC server process shares this database.
#
# server.authorization.policy-refresh-interval=PT1M
#   How often this instance polls casbin_rule for changes and reloads if needed.
#   Lower this for faster revoke propagation across replicas; raise it for very large
#   policy tables to reduce count(*)/max(id) load.
#
# server.authorization.policy-refresh-min-probe-interval=PT1S
#   Minimum gap between deny-path max(id) probes (default: 1s). Quiet traffic is unlikely to wait.
#   Under many 403s per second, lower this toward PT0S so denials probe immediately instead
#   of waiting out the remainder of the 1s window. That increases casbin_rule load.

# Enable MANAGED table
# Default: true (enabled)
# server.managed-table.enabled=true
# Enable native Iceberg tables. When disabled, existing ones stay readable.
# Default: true (enabled)
# server.iceberg-table.enabled=true
# Comma-separated local directories under which external Iceberg tables may be created without an
# external location (strictly under: not the directory itself). Unset: local external Iceberg
# tables need an external location. Any principal who can create a table can use these roots.
# server.external-local-roots=/data/uc-external,/mnt/shared

# Managed storage cleanup worker. One worker runs in each UC server process.
# server.storage-cleanup.poll-interval=PT1M
# Cooperative budget checked between cleanup operations; in-flight calls use provider defaults.
# server.storage-cleanup.attempt-timeout=PT30M
# The lease must exceed the attempt timeout. This does not bound an in-flight storage call.
# server.storage-cleanup.lease-duration=PT2H
# Delay before cleanup becomes eligible; this does not provide table recovery.
# server.storage-cleanup.initial-delay=P7D
# Delay after a failed or incomplete attempt.
# server.storage-cleanup.retry-backoff=PT1H

# Storage credential cache: reuse vended cloud credentials instead of vending on every request.
# Default: false (disabled)
# server.storage-credential-cache.enabled=false
# The maximum number of distinct credentials to keep.
# server.storage-credential-cache.max-size=1000
# The longest a vended credential is reused, counted from when it was vended.
# server.storage-credential-cache.max-age=PT5M

# The class that receives audit records, one per issued storage credential, permission change and
# queued storage cleanup; unset (default) = off. FileAuditSink writes to the Log4j audit logger
# (etc/logs/audit.log as shipped). See the docs.
# server.audit.sink=io.unitycatalog.server.audit.FileAuditSink

#### AWS credential configs

# The master role ARN for AwsIamRole storage credential. This should be set to the same ARN that
# the UC server is running as. If the server is running on-premises and using an IAM user, this
# ARN can also be set to the IAM user. It will be advertised as unity_catalog_iam_arn in AWS
# credential securables to users so that they know which UC role (or user) to trust by their
# storage role.
aws.masterRoleArn=
# The AWS credential of masterRoleArn to be used by server. If not set, server uses the
# DefaultCredentialsProvider.
aws.accessKey=
# Deprecated here: set it in the UC_AWS_SECRETKEY environment variable instead
# (see Secrets in docs/server/configuration.md).
aws.secretKey=
# The region of AWS. If running on-premises, pick the nearest region.
aws.region=

# Experimental: S3-compatible storage such as MinIO or Ceph, through s3_compatible storage
# credentials. When disabled, such credentials cannot be created, an update cannot set one, and
# none is used to vend credentials; other updates, reads and deletes of existing ones still work.
# Default: false (disabled)
# server.s3-compatible-storage.enabled=false

# What clients receive for an s3_compatible storage credential without assume_role, that is, for
# S3-compatible storage without STS. Credentials with assume_role always vend scoped short-lived
# sessions and ignore this setting.
#   endpoint-only (default): the S3 endpoint and region, but no keys. The server
#                     uses the key pair for its own storage access; engines must bring their own keys.
#   static-key: the key pair itself. Its one-hour lifetime only makes engines fetch it again
#                     and pick up an updated key; the key itself stays valid until the storage
#                     rotates or revokes it. Iceberg clients get no lifetime and keep it until they
#                     load the table again. It is not narrowed to the requested table or path, so any
#                     client that can read a table can use it for everything the key reaches.
server.s3-compatible-storage.static-key-vending=endpoint-only

# The key that the secret_access_key of s3_compatible storage credentials is encrypted with in the
# database (AES-256-GCM): 32 random bytes in base64, such as the output of `openssl rand -base64 32`.
# Required to create or use such credentials. Set it in the UC_SERVER_CREDENTIAL_ENCRYPTION_KEY
# environment variable, not here: setting it in this file logs a deprecation warning. Use the same
# key on every server instance. Values stored with a key cannot be read after it is changed, so
# keep it as long as the credentials exist. It is read only when s3-compatible storage is enabled;
# then a value that is not a base64-encoded 32-byte key stops the server at startup.
# server.credential-encryption-key=

#### The following "s3.*" configs are legacy per-bucket hardcoded credential config

## S3 Storage Config (Multiple configs can be added by incrementing the index)
s3.bucketPath.0=
s3.region.0=
s3.awsRoleArn.0=
# Optional (If blank, it will use DefaultCredentialsProviderChain)
s3.accessKey.0=
# Deprecated here: set the secret in an environment variable instead, for example UC_S3_SECRETKEY_0
# (see Secrets in docs/server/configuration.md).
s3.secretKey.0=
# Test Only (If you provide a session token, it will just use those session creds, no downscoping)
# Deprecated here: set it in an environment variable instead, for example UC_S3_SESSIONTOKEN_0
# (see Secrets in docs/server/configuration.md).
s3.sessionToken.0=

## ADLS Storage Config (Multiple configs can be added by incrementing the index)
adls.storageAccountName.0=
adls.tenantId.0=
adls.clientId.0=
# Deprecated here: set the secret in an environment variable instead, for example UC_ADLS_CLIENTSECRET_0
# (see Secrets in docs/server/configuration.md).
adls.clientSecret.0=

## GCS Storage Config (Multiple configs can be added by incrementing the index)
gcs.bucketPath.0=
# Optional (If blank, it will use Default Application chain to find credentials)
gcs.jsonKeyFilePath.0=

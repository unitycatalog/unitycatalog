status = warn
appenders = rollingFile, auditFile

appender.rollingFile.type = RollingFile
appender.rollingFile.name = RollingFile
appender.rollingFile.fileName = etc/logs/server.log
appender.rollingFile.filePattern = etc/logs/server-%d{MM-dd-yyyy-HH-mm-ss}-%i.log.gz
appender.rollingFile.layout.type = PatternLayout
appender.rollingFile.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

appender.rollingFile.policies.type = Policies
appender.rollingFile.policies.time.type = TimeBasedTriggeringPolicy
appender.rollingFile.policies.time.interval = 1
appender.rollingFile.policies.size.type = SizeBasedTriggeringPolicy
appender.rollingFile.policies.size.size = 10MB

appender.rollingFile.strategy.type = DefaultRolloverStrategy
appender.rollingFile.strategy.max = 5
appender.rollingFile.strategy.fileIndex = max

appender.rollingFile.strategy.action.type = Delete
appender.rollingFile.strategy.action.basePath = etc/logs
appender.rollingFile.strategy.action.condition.type = IfFileName
appender.rollingFile.strategy.action.condition.glob = server-*.log.gz
appender.rollingFile.strategy.action.ifAny.type = IfAccumulatedFileCount
appender.rollingFile.strategy.action.ifAny.exceeds = 5

rootLogger.level = info
rootLogger.appenderRefs = rollingFile
rootLogger.appenderRef.rollingFile.ref = RollingFile
# Audit records (server.audit.sink=io.unitycatalog.server.audit.FileAuditSink): one JSON line per
# record. Same rollover settings as server.log; no file is created until the first record.
appender.auditFile.type = RollingFile
appender.auditFile.name = AuditFile
appender.auditFile.fileName = etc/logs/audit.log
appender.auditFile.filePattern = etc/logs/audit-%d{MM-dd-yyyy-HH-mm-ss}-%i.log.gz
appender.auditFile.createOnDemand = true
appender.auditFile.ignoreExceptions = false
appender.auditFile.layout.type = PatternLayout
appender.auditFile.layout.pattern = %m%n

appender.auditFile.policies.type = Policies
appender.auditFile.policies.time.type = TimeBasedTriggeringPolicy
appender.auditFile.policies.time.interval = 1
appender.auditFile.policies.size.type = SizeBasedTriggeringPolicy
appender.auditFile.policies.size.size = 10MB

appender.auditFile.strategy.type = DefaultRolloverStrategy
appender.auditFile.strategy.max = 5
appender.auditFile.strategy.fileIndex = max

appender.auditFile.strategy.action.type = Delete
appender.auditFile.strategy.action.basePath = etc/logs
appender.auditFile.strategy.action.condition.type = IfFileName
appender.auditFile.strategy.action.condition.glob = audit-*.log.gz
appender.auditFile.strategy.action.ifAny.type = IfAccumulatedFileCount
appender.auditFile.strategy.action.ifAny.exceeds = 5

logger.audit.name = audit
logger.audit.level = info
logger.audit.additivity = false
logger.audit.appenderRef.auditFile.ref = AuditFile
